# fly.toml app configuration file generated for flightlogger on 2026-06-12T14:43:43+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'flightlogger'
primary_region = 'lhr'

[build]

[env]
  BACKUP_DIR = '/data/backups'
  DB_PATH = '/data/flightlogger.db'

[[mounts]]
  source = 'flightlogger_data'
  destination = '/data'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
